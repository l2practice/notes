    </linearGradient>
    <linearGradient id="barrel" gradientUnits="userSpaceOnUse" x1="35" y1="-2" x2="5" y2="29">
      <stop stop-color="#fff6e4"/><stop offset=".34" stop-color="#f9ecd4"/><stop offset=".68" stop-color="#e7d3b1"/><stop offset="1" stop-color="#ceb58e"/>
