<!-- ===== Notebooks Reminder v37 =====
     An Eisenhower matrix of tasks, in the light Interactive Board look (layout after the reference app, not its colours).
     - Hello! 👋 · streak (days in a row with at least one task done) · My Matrix ▾ (several matrices) · Done · grid / list
     - Important & Urgent · Important · Urgent · Someday: count, +, "Tap to add", round checkbox, due date (red when late)
     - Tasks: title, note, quadrant, due date, reminder time, done. Tap to edit, drag to another quadrant, + floating button.
     - Calendar (month; tap a day for its tasks) · Lock (Note Hub's lock screen) · Settings (matrix name, streak, notifications)
     - Reminders: while Notebooks is open, a reminder time shows a banner and, where the browser allows it, a system
       notification. There is no service worker, so nothing arrives while the app is closed. The rail shows how many
       tasks are due today or late.
     Data: data.reminder = { version: 1, matrices: [...], tasks: [...], doneDays: { 'YYYY-MM-DD': n }, streakResetAt, tombs }
     — part of the notebook data (IndexedDB + Google Drive), merged by id on sync. Device-only settings stay in localStorage.
     Paste before </body>, after patches v20–v36 (needs v35 and v36). To remove: delete this block. -->

<script>
(function(){
  if (typeof data === 'undefined' || !window.nbxView) return;
  const $q = s => document.querySelector(s);
  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const svg = p => '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
  const I = {
    flame: '<path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.3 2.2-5.1 3.6-7.3.4 1.6 1.2 2.6 2.3 3.1-.2-2.9.9-5.4 3.1-7.6.3 3 1.6 4.7 2.9 6.6.8 1.2 1.1 2.4 1.1 3.9 0 3.7-2.5 6.5-6.5 6.5z"/>',
    cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17.3h.01M12 17.3h.01"/>',
    bolt: '<path d="M13.5 3 5 13.5h6.5L10.5 21 19 10.5h-6.5z"/>',
    lines: '<path d="M5 8h14M5 12h14M5 16h14"/>',
    plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="m6 12.5 4 4 8-9"/>', chev: '<path d="m6 9 6 6 6-6"/>',
    grid: '<rect x="4" y="4" width="7" height="7" rx="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.8"/>',
    list: '<path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3M12 14.5v2.5"/>',
    bell: '<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', left: '<path d="m15 6-6 6 6 6"/>', right: '<path d="m9 6 6 6-6 6"/>'
  };
  const Q = {
    1: { name: 'Important & Urgent', short: 'Do now', icon: I.flame, c: '#D2372F', t: '#FDECEA' },
    2: { name: 'Important', short: 'Schedule', icon: I.cal, c: '#5661E0', t: '#E3E6FD' },
    3: { name: 'Urgent', short: 'Quick / delegate', icon: I.bolt, c: '#B7791F', t: '#FDF3DC' },
    4: { name: 'Someday', short: 'Later', icon: I.lines, c: '#585D80', t: '#F1F2F8' }
  };
  const qStyle = q => `--qc:${Q[q].c};--qt:${Q[q].t}`;

  /* ---------- data ---------- */
  function store(){
    let r = data.reminder;
    if (!r || typeof r !== 'object') r = data.reminder = {};
    if (!r.version) r.version = 1;
    if (!Array.isArray(r.matrices)) r.matrices = [];
    if (!Array.isArray(r.tasks)) r.tasks = [];
    if (!r.doneDays || typeof r.doneDays !== 'object') r.doneDays = {};
    if (!r.tombs) r.tombs = {};
    if (!r.matrices.length) r.matrices.push({ id: 'default', name: 'My Matrix', createdAt: Date.now(), updatedAt: 0 });   // the same id on every device
    return r;
  }
  const peek = () => (data.reminder && Array.isArray(data.reminder.tasks)) ? data.reminder : null;
  const pref = (k, d) => { try { const v = localStorage.getItem('nbx_rem_' + k); return v == null ? d : v; } catch (e) { return d; } };
  const setPref = (k, v) => { try { localStorage.setItem('nbx_rem_' + k, String(v)); } catch (e) {} };
  const save = () => { nbxView.save(); badge(); };
  const pad = n => String(n).padStart(2, '0');
  const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => dayKey(new Date());
  const parseDay = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const curMatrix = () => { const r = store(); return r.matrices.find(m => m.id === pref('matrix', '')) || r.matrices[0]; };
  const tasksOf = (mid) => store().tasks.filter(t => t.matrixId === mid);
  function dueLabel(t){
    if (!t.due) return '';
    const d = parseDay(t.due), k = today(), late = !t.done && t.due < k, isToday = t.due === k;
    let s = isToday ? 'Today' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
    if (t.time) s += ' · ' + t.time;
    return `<div class="d${late ? ' late' : isToday && !t.done ? ' today' : ''}">${t.time ? svg(I.bell) : ''}${esc(s)}</div>`;
  }
  const sortTasks = a => a.slice().sort((x, y) => (x.done - y.done) || ((x.due || '9999') + (x.time || '99')).localeCompare((y.due || '9999') + (y.time || '99')) || (x.createdAt || 0) - (y.createdAt || 0));

  /* ---------- streak ---------- */
  function streak(){
    const r = peek(); if (!r) return 0;
    const days = r.doneDays || {}, reset = r.streakResetAt ? dayKey(new Date(r.streakResetAt)) : '';
    const d = new Date(); let n = 0;

    };
  }

  nbxView.register('reminder', {
    label: 'Reminder', icon: I.bell,
    show(el){ root = el; store(); if (!el._rmBound){ bind(el); el._rmBound = true; } tab = 'tasks'; render(); check(); },
    home(){ tab = 'tasks'; render(); },
    hide(){ closeSheet(); closeMenu(); root = null; }
  });
  badge(); setTimeout(check, 1500);
})();
</script>
