<!-- Note House patch v30: the font and size boxes show the real font and size where the caret is, and pasted text
     comes in as Google Sans (the page's own font) instead of the font of the place it was copied from.
     Paste before </body>, after patches v20–v29 (needs the updated v23). -->
<script>
(function(){
  if (typeof editor === 'undefined') return;
  const $q = s => document.querySelector(s);
  /* ---------- 1. pasted text takes the page's font ---------- */
  function stripFonts(el){
    if (el.nodeType !== 1) return;
    [el, ...el.querySelectorAll('*')].forEach(x => {
      if (x.style && x.style.fontFamily){ x.style.removeProperty('font-family'); if (!x.getAttribute('style').trim()) x.removeAttribute('style'); }
      if (x.tagName === 'FONT' && x.hasAttribute('face')) x.removeAttribute('face');
    });
  }
  editor.addEventListener('paste', () => {
    const added = [], obs = new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) added.push(n); else if (n.parentElement && n.parentElement !== editor) added.push(n.parentElement); })));
    obs.observe(editor, { childList: true, subtree: true });
    setTimeout(() => { obs.disconnect(); if (!added.length) return; added.forEach(stripFonts); try { storeCurrent(false); } catch (e) {} }, 150);   // whichever way the paste went in
  }, true);

  /* ---------- 2. the font and size boxes follow the caret ---------- */
  const fontSel = $q('#fontFamily'), sizeSel = $q('#fontSize'), current = $q('#fontPickerCurrent');
  function ensureOption(sel, v){ if (sel && ![...sel.options].some(o => o.value === v || o.textContent === v)){ const o = document.createElement('option'); o.value = v; o.textContent = v; o.dataset.auto = '1'; sel.appendChild(o); } }
  let busy = 0;
  document.addEventListener('selectionchange', () => {
    cancelAnimationFrame(busy); busy = requestAnimationFrame(() => {
      const s = getSelection(); if (!s.rangeCount) return;
      let n = s.getRangeAt(0).startContainer;
      // the first letters of the selection, not the paragraph around them; never the grip and × of a note container (their text has size 0)
      const ctl = t => t.parentElement && t.parentElement.closest('.note-block-controls,.note-block-handle,[contenteditable="false"]:not(.note-block)');
      if (n.nodeType === 1){
        const start = n.childNodes[s.getRangeAt(0).startOffset] || null, w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT, { acceptNode: t => ctl(t) || !t.data.trim() ? NodeFilter.FILTER_SKIP : NodeFilter.FILTER_ACCEPT });
        let t; while ((t = w.nextNode())) if (!start || start === t || start.contains(t) || (start.compareDocumentPosition(t) & Node.DOCUMENT_POSITION_FOLLOWING)) break;
        n = t || n;
      }
      let el = n && (n.nodeType === 1 ? n : n.parentElement); if (!el || !editor.contains(el) || el.closest('.note-block-controls')) return;
      while (el && el !== editor && !(parseFloat(getComputedStyle(el).fontSize) > 0)) el = el.parentElement;
      if (!el) return;
      const cs = getComputedStyle(el), fam = cs.fontFamily.split(',')[0].replace(/["']/g, '').trim(), px = (v => String(Number.isInteger(v) ? v : v))(Math.round(parseFloat(cs.fontSize) * 0.75 * 2) / 2);   // shown in points, like the list
      if (fontSel && fam && fontSel.value !== fam){ ensureOption(fontSel, fam); fontSel.value = fam; if (current){ current.textContent = fam; current.style.fontFamily = '"' + fam + '", sans-serif'; } }
      if (sizeSel && +px > 0 && sizeSel.value !== px){ ensureOption(sizeSel, px); sizeSel.value = px; }
    });
  });
})();
</script>
